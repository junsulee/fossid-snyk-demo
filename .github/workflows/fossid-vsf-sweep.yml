name: FossID VSF sweep (full repo)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # 월요일 09:00 UTC = 한국시간 18:00

jobs:
  vsf:
    runs-on: ubuntu-latest
    environment: fossid

    container:
      image: quay.io/fossid/fossid-toolbox:latest
      credentials:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tracked file list
        run: |
          git config --global --add safe.directory "$(pwd)"
          git ls-files -z > filelist.txt

      - name: Create .fossid config (for filescan)
        env:
          FOSSID_HOST:  ${{ secrets.FOSSID_HOST }}
          FOSSID_TOKEN: ${{ secrets.FOSSID_TOKEN }}
        run: |
          # filescan은 CLI 플래그 대신 설정파일을 요구합니다.
          # 컨테이너 워크디렉터리에 .fossid 생성
          cat > .fossid <<EOF
          {
            "server": "${FOSSID_HOST}",
            "token": "${FOSSID_TOKEN}"
          }
          EOF

      - name: Run VSF across tracked files
        run: |
          : > vsf.ndjson
          # -mode vsf (단일 대시!) + --fossid-conf-path 로 .fossid를 지정
          while IFS= read -r -d "" f; do
            fossid filescan -mode vsf \
              --fossid-conf-path . \
              "$f" || true
          done < filelist.txt >> vsf.ndjson

      - name: Summarize & gate on VSF hits
        run: |
          hits=$(grep -c '"type":"vulnerability"' vsf.ndjson || true)
          echo "VSF vulnerable-snippet hits: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "Found vulnerable code snipp
