name: FossID VSF sweep (full repo)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # 월요일 09:00 UTC = 한국시간 18:00

jobs:
  vsf:
    runs-on: ubuntu-latest
    environment: fossid

    container:
      image: quay.io/fossid/fossid-toolbox:latest
      credentials:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tracked file list
        run: |
          git config --global --add safe.directory "$(pwd)"
          git ls-files -z > filelist.txt

      - name: Run VSF across tracked files
        env:
          FOSSID_HOST:  ${{ secrets.FOSSID_HOST }}
          FOSSID_TOKEN: ${{ secrets.FOSSID_TOKEN }}
        run: |
          : > vsf.ndjson
          while IFS= read -r -d "" f; do
            fossid filescan --mode vsf \
              --fossid-host "$FOSSID_HOST" \
              --fossid-token "$FOSSID_TOKEN" \
              "$f" || true
          done < filelist.txt >> vsf.ndjson

      - name: Summarize & gate on VSF hits
        run: |
          hits=$(grep -c '"type":"vulnerability"' vsf.ndjson || true)
          echo "VSF vulnerable-snippet hits: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "Found vulnerable code snippets. Failing."
            exit 1
          fi

      - name: Upload artifact (raw NDJSON)
        uses: actions/upload-artifact@v4
        with:
          name: fossid-vsf-ndjson
          path: vsf.ndjson
