name: FossID VSF sweep (full repo)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # 월요일 09:00 UTC = 한국시간 18:00

jobs:
  vsf:
    runs-on: ubuntu-latest
    environment: fossid  # Environments → fossid 의 시크릿 사용

    container:
      image: quay.io/fossid/fossid-toolbox:latest
      credentials:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git (safe.directory) & file list
        run: |
          git config --global --add safe.directory "$(pwd)"
          git ls-files -z > filelist.txt

      - name: Run VSF (human-readable output like your screenshot)
        env:
          FOSSID_HOST:  ${{ secrets.FOSSID_HOST }}
          FOSSID_TOKEN: ${{ secrets.FOSSID_TOKEN }}
        run: |
          : > vsf.log
          # 각 파일을 VSF 모드로 검사 (표준출력은 사람이 읽기 좋은 텍스트)
          while IFS= read -r -d "" f; do
            fossid filescan --mode vsf "$f" || true
          done < filelist.txt | tee -a vsf.log

      - name: Summarize & gate on VSF hits
        run: |
          # VSF 텍스트 헤더 라인을 카운트하여 게이트
          hits=$(grep -c '^VSF issue found in file:' vsf.log || true)
          echo "VSF vulnerable-snippet hits: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "Found vulnerable code snippets. Failing."
            exit 1
          fi

      - name: Upload VSF log
        uses: actions/upload-artifact@v4
        with:
          name: fossid-vsf-log
          path: vsf.log
