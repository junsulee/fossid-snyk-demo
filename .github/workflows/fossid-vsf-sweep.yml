name: FossID VSF sweep (full repo)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # 월요일 09:00 UTC = 한국시간 월요일 18:00

jobs:
  vsf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull toolbox image
        run: |
          docker pull quay.io/fossid/fossid-toolbox:latest

      - name: Generate tracked file list
        run: |
          git ls-files -z > filelist.txt

      - name: Run VSF across tracked files (inside container)
        env:
          FOSSID_HOST:  ${{ secrets.FOSSID_HOST }}
          FOSSID_TOKEN: ${{ secrets.FOSSID_TOKEN }}
        run: |
          # 컨테이너 안에서 파일 리스트를 읽어 VSF 스캔하고 NDJSON에 누적
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e FOSSID_HOST \
            -e FOSSID_TOKEN \
            quay.io/fossid/fossid-toolbox:latest \
            sh -lc '
              : > /workspace/vsf.ndjson
              # filelist.txt 는 널 구분(-z)이라 read -d "" 로 처리
              while IFS= read -r -d "" f; do
                fossid filescan --mode vsf \
                  --fossid-host "$FOSSID_HOST" \
                  --fossid-token "$FOSSID_TOKEN" \
                  "$f" || true
              done < /workspace/filelist.txt >> /workspace/vsf.ndjson
            '

      - name: Summarize & gate on VSF hits
        run: |
          hits=$(grep -c '"type":"vulnerability"' vsf.ndjson || true)
          echo "VSF vulnerable-snippet hits: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "Found vulnerable code snippets. Failing."
            exit 1
          fi

      - name: Upload artifact (raw NDJSON)
        uses: actions/upload-artifact@v4
        with:
          name: fossid-vsf-ndjson
          path: vsf.ndjson
