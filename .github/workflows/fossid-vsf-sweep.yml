name: FossID VSF sweep (full repo)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # 월요일 09:00 UTC = 한국시간 18:00

jobs:
  vsf:
    runs-on: ubuntu-latest
    environment: fossid  # Environments → fossid 의 시크릿 사용

    container:
      image: quay.io/fossid/fossid-toolbox:latest
      credentials:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare repo for git commands (safe dir)
        run: |
          git config --global --add safe.directory "$(pwd)"

      - name: Generate tracked file list
        run: git ls-files -z > filelist.txt

      - name: Create fossid.conf (INI + [CLI] section)
        env:
          FOSSID_HOST:  ${{ secrets.FOSSID_HOST }}
          FOSSID_TOKEN: ${{ secrets.FOSSID_TOKEN }}
        run: |
          cat > fossid.conf <<'CONF'
          [CLI]
          server=
          token=
          CONF
          # 값 채우기 (따옴표 없이)
          sed -i "s|^server=.*$|server=${FOSSID_HOST}|" fossid.conf
          sed -i "s|^token=.*$|token=${FOSSID_TOKEN}|" fossid.conf
          # 디버그(토큰은 출력 안 함)
          grep '^server=' fossid.conf

      - name: Run VSF (prints human-readable + collects NDJSON)
        run: |
          fossid version || true
          : > vsf.ndjson
          while IFS= read -r -d "" f; do
            # 화면에는 사람이 읽기 쉬운 VSF 리포트가 출력됨
            fossid filescan --mode vsf \
              --fossid-conf-path ./fossid.conf \
              "$f" \
              2>&1
            # NDJSON도 함께 수집 (가능한 경우에만 출력됨)
            fossid filescan --mode vsf \
              --fossid-conf-path ./fossid.conf \
              "$f" \
              --output-format ndjson \
              --output - \
              >> vsf.ndjson || true
          done < filelist.txt

      - name: Summarize & gate on VSF hits
        run: |
          # 텍스트 로그 기준 카운트(스크린샷 같은 헤더 라인)
          hits_text=$(grep -c '^VSF issue found in file:' "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true)
          # NDJSON 기준 카운트(없으면 0)
          hits_json=$(grep -c '"type":"vulnerability"' vsf.ndjson 2>/dev/null || true)
          hits=$(( (hits_text>hits_json?hits_text:hits_json) ))
          echo "VSF vulnerable-snippet hits: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "Found vulnerable code snippets. Failing."
            exit 1
          fi

      - name: Upload NDJSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: fossid-vsf-ndjson
          path: vsf.ndjson
